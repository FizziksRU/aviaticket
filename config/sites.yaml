# Источники цен.
#
# source: api      HTTP-клиент без браузера (parser = имя клиента)
# source: browser  Playwright открывает url_template, дальше парсер из src/avia/parsers/
#                  (parser: имя) или, если use_llm: true, разбор через LLM
#
# Плейсхолдеры в url_template: {origin} {destination} {date_iso} {ddmm} {ddmmyyyy} {adults}
# Коды городов IATA (MOW, ALA, TAS, MSQ, EVN ...).

sites:
  # Работает сразу после получения токена (TP_TOKEN в .env). Это кэш поисков Aviasales
  # за последние ~48 часов, не живая цена. Цена за одного пассажира умножается на число пассажиров.
  - name: aviasales_cache
    source: api
    parser: travelpayouts
    enabled: false
    url_template: ""
    note: "бесплатно, без браузера; цена может отличаться от живой"

  # Живая выдача Aviasales.
  - name: aviasales
    source: browser
    parser: aviasales
    enabled: true
    url_template: "https://www.aviasales.ru/search/{origin}{ddmm}{destination}{adults}"
    settle_ms: 25000
    scrolls: 4
    note: "выдача грузится 30-60 секунд, поэтому большой settle_ms"

  # Живая выдача Купибилет.
  - name: kupibilet
    source: browser
    parser: kupibilet
    enabled: true
    url_template: "https://www.kupibilet.ru/search?route%5B0%5D=iatax%3A{origin}_{date_iso}_date_{date_iso}_iatax%3A{destination}&adult={adults}&child=0&infant=0&childrenAges=%5B%5D&cabinClass=Y&v=2&filter=%7B%22transportKind%22%3A%7B%22Airplane%22%3Atrue%2C%22Train%22%3Afalse%7D%7D"
    settle_ms: 15000
    scrolls: 2

  # Заглушки: шаблон URL нужно снять руками с реальной выдачи, потом recon и парсер.
  - name: tutu
    source: browser
    parser: tutu
    id_resolver: tutu
    enabled: true
    url_template: "https://avia.tutu.ru/f/{origin_seo}/{destination_seo}/?class=Y&travelers={adults}&route[0]={origin_id}-{ddmmyyyy}-{destination_id}"
    settle_ms: 20000
    scrolls: 2

  - name: yandex_travel
    source: browser
    enabled: false
    url_template: "https://travel.yandex.ru/avia/search/result/?adult_seats=1&children_seats=0&fromId=c213&infant_seats=0&klass=economy&oneway=1&salesChannel=B2C&toId=c22177&when=2026-12-12"
    settle_ms: 30000
    scrolls: 2
