# docker compose up -d --build   (секреты — в .env рядом, в образ не попадают)
services:
  bot:
    build:
      context: .
      args:
        WITH_BROWSER: "0"
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 40s
    volumes:
      - ./state:/app/state
      - ./debug:/app/debug
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
